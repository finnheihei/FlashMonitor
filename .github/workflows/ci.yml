name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Frontend behavior checks
        run: |
          node tests/check_ui_attribution.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_controls.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_i18n.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_notices.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_settings_feedback.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_navigation_state.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_usage_scope.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_update.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_preferences.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_ipv6_races.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_reset.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_subscription.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_filter_recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FM_TEST_LANGUAGE = 'en'
          node tests/check_ui_attribution.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_controls.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_settings_feedback.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_navigation_state.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_usage_scope.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_update.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_preferences.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_ipv6_races.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_reset.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_subscription.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check_ui_filter_recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
