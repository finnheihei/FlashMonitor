<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Monitor</title>
<style>
  :root {
    --bg: #f3f3f3;
    --panel: #fff;
    --line: #ddd;
    --ink: #1f1f1f;
    --mute: #6b6b6b;
    --proxy: #0078d4;
    --direct: #107c10;
    --up: #c23900;
    --bar: #d0d0d0;
    --sel: #e8f1fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 13px/1.45 "Segoe UI", "PingFang SC", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 18px 28px; }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 10px;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .nav { display: flex; gap: 2px; }
  .nav button, .period button, .tools button, .tools select {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 4px 10px;
    cursor: pointer;
  }
  .nav button.on, .period button.on { background: var(--sel); border-color: #99c9ef; }
  .search { flex: 1; min-width: 160px; }
  .search input {
    width: 100%; border: 1px solid var(--line); padding: 5px 8px; background: #fff;
  }
  .rates { color: var(--mute); font-variant-numeric: tabular-nums; }
  header .upd {
    background: var(--panel); border: 1px solid var(--line);
    padding: 4px 10px; cursor: pointer; white-space: nowrap;
  }
  header .upd.fresh { background: var(--sel); border-color: #99c9ef; }
  .meta { color: var(--mute); font-size: 12px; margin: 0 0 10px; }
  .period { display: flex; gap: 2px; flex-wrap: wrap; }
  .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .chart-box { background: var(--panel); border: 1px solid var(--line); margin-bottom: 10px; }
  .chart-head { display: flex; justify-content: space-between; padding: 8px 10px 0; color: var(--mute); font-size: 12px; }
  .legend span { margin-left: 12px; }
  .chart-wrap { position: relative; }
  #chart { display: block; width: 100%; height: 120px; }
  #chart-tip {
    position: absolute; top: 8px; left: 8px; background: #fff;
    border: 1px solid var(--line); padding: 4px 6px; font-size: 11px;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--mute); font-weight: 600; font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { display: block; height: 4px; background: var(--bar); margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--proxy); }
  .bar i.d { background: var(--direct); }
  .rk { color: var(--mute); width: 2em; }
  .foldable { cursor: pointer; }
  .site td:nth-child(2) { padding-left: 22px; color: var(--mute); }
  .empty { color: var(--mute); padding: 24px; text-align: center; }
  .down { color: var(--direct); }
  .proxy { color: var(--proxy); }
  .up { color: var(--up); }
  .sum { color: var(--mute); font-size: 12px; margin: 0 0 8px; }
  .settings { background: var(--panel); border: 1px solid var(--line); padding: 16px 18px; max-width: 560px; }
  .settings h2 { margin: 18px 0 8px; font-size: 13px; font-weight: 600; }
  .settings h2:first-child { margin-top: 0; }
  .settings .row { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; cursor: pointer; }
  .settings .row input { margin-top: 3px; }
  .settings .hint { color: var(--mute); font-size: 12px; margin: 2px 0 0; }
  .settings .field { margin: 12px 0; }
  .settings .field label { display: block; margin-bottom: 4px; }
  .settings input[type=text], .settings input[type=number], .settings input[type=password] {
    width: 100%; border: 1px solid var(--line); padding: 5px 8px; background: #fff;
  }
  .settings .path { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; word-break: break-all; color: var(--mute); }
  .settings .ok { color: var(--direct); font-size: 12px; margin-left: 8px; }
  .settings .err { color: #c42b1c; font-size: 12px; }
  .quota { background: #fff4ce; border: 1px solid #e0c36e; padding: 8px 10px; margin: 0 0 10px; }
  .quota p { margin: 0 0 4px; }
  .quota p:last-child { margin: 0; }
  .quota .leak-line { color: #c42b1c; cursor: pointer; }
  .quota .new-line button { margin-left: 8px; padding: 1px 8px; }
  .airport { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; margin: 0 0 10px; }
  .airport p { margin: 0 0 4px; }
  .airport p:last-child { margin: 0; }
  .airport .hint { color: var(--mute); font-size: 12px; }
  .airport .bar { margin-top: 6px; }
  .airport button { margin-left: 8px; padding: 1px 8px; cursor: pointer; background: var(--panel); border: 1px solid var(--line); }
  .leak-tag { color: #c42b1c; font-weight: 600; }
  .act { text-align: right; white-space: nowrap; width: 3.5em; }
  .act button { padding: 1px 8px; cursor: pointer; background: var(--panel); border: 1px solid var(--line); }
  .live {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 10px 12px 8px;
    margin-bottom: 10px;
  }
  .pipe-track {
    display: flex;
    height: 8px;
    background: var(--bar);
    overflow: hidden;
  }
  .pipe-track i { display: block; height: 100%; }
  .pipe-track .proxy { background: var(--proxy); }
  .pipe-track .direct { background: var(--direct); }
  .pipe-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  .pipe-meta .split { color: var(--mute); }
  .eaters {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 8px;
    min-height: 22px;
  }
  .eaters .who, .app {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .eaters .who img, .app img {
    width: 16px; height: 16px; flex: none;
  }
  .eaters .who .spd { color: var(--mute); font-variant-numeric: tabular-nums; }
  .row-act { margin-left: 8px; opacity: 0.45; }
  tr:hover .row-act { opacity: 1; }
  .row-act button {
    padding: 0 6px; font-size: 11px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line);
  }
  .pinned-mark { color: var(--proxy); margin-right: 4px; }
  .settings .ign-list { list-style: none; padding: 0; margin: 8px 0 0; }
  .settings .ign-list li {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .settings .ign-list button {
    padding: 1px 8px; cursor: pointer; background: var(--panel); border: 1px solid var(--line);
  }
  @media (max-width: 800px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <nav class="nav" id="filters"></nav>
    <label class="search"><input id="q" type="search" placeholder="搜索" autocomplete="off"></label>
    <button type="button" class="upd" id="btn-update">更新</button>
  </header>
  <p class="meta" id="status">采集中…</p>
  <section class="live" id="live">
    <div class="pipe-track" id="pipe"><i class="proxy" id="pipe-proxy" style="width:0"></i><i class="direct" id="pipe-direct" style="width:0"></i></div>
    <div class="pipe-meta">
      <span class="rates" id="rates"></span>
      <span class="split" id="split-lab"></span>
    </div>
    <div class="eaters" id="eaters"></div>
  </section>
  <div id="airport" class="airport" hidden></div>
  <div id="quota" class="quota" hidden></div>
  <div class="tools">
    <div class="period" id="rank-modes"></div>
    <div class="period" id="periods"></div>
    <select id="sort">
      <option value="traffic">按流量</option>
      <option value="speed">按速率</option>
      <option value="name">按名称</option>
    </select>
    <button type="button" id="btn-export">导出 CSV</button>
    <button type="button" id="btn-reset">清零累计</button>
    <label class="row-act" style="opacity:1;margin-left:0">
      <input type="checkbox" id="show-ignored"> 显示已忽略
    </label>
  </div>
  <section class="chart-box">
    <div class="chart-head">
      <span>速率</span>
      <div class="legend">
        <span class="proxy">代理↓</span>
        <span class="down">直连↓</span>
        <span class="up">上传↑</span>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <div id="chart-tip" hidden></div>
    </div>
  </section>
  <div id="main"></div>
</div>
<script>
const FILTERS = [["rank","排行"],["lanes","分流"],["conns","连接"],["closed","已结束"],["settings","设置"]];
const PERIODS = [["1h","近 1 小时"],["today","今天"],["7d","近 7 天"],["30d","近 30 天"],["all","累计"]];
const NAMES = {
  msedge:"Edge", chrome:"Chrome", firefox:"Firefox", msedgewebview2:"WebView",
  Weixin:"微信", WeChatAppEx:"微信", JianyingPro:"剪映", language_server:"Antigravity",
  Cursor:"Cursor", steam:"Steam", python:"Python", ssh:"SSH",
  node:"Node.js",
  MpDefenderCoreService:"Defender"
};
let filter = "rank";
let period = "today";
let rankMode = "proxy";
let leakOnly = false;
let last = null;
let settingsCache = null;
let settingsNote = "";
let updateInfo = null;
const opened = new Set();
let hoverIdx = -1;
const box = document.getElementById("filters");
FILTERS.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.textContent = label;
  if (id === filter) b.className = "on";
  b.onclick = async () => {
    filter = id;
    if (id !== "conns") leakOnly = false;
    [...box.children].forEach(x => x.classList.toggle("on", x.textContent === label));
    if (id === "settings") await loadSettings();
    render();
  };
  box.appendChild(b);
});
const RANK_MODES = [["proxy","代理用量"],["node","节点"],["site","网站"],["all","全部流量"]];
const mbox = document.getElementById("rank-modes");
RANK_MODES.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.textContent = label;
  if (id === rankMode) b.className = "on";
  b.onclick = () => {
    rankMode = id;
    [...mbox.children].forEach(x => x.classList.toggle("on", x.textContent === label));
    render();
  };
  mbox.appendChild(b);
});
const pbox = document.getElementById("periods");
PERIODS.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.textContent = label;
  if (id === period) b.className = "on";
  b.onclick = () => {
    period = id;
    [...pbox.children].forEach(x => x.classList.toggle("on", x.textContent === label));
    render();
  };
  pbox.appendChild(b);
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
document.getElementById("btn-export").onclick = async () => {
  const r = await fetch("/api/export.csv");
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tun-split.csv";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("btn-reset").onclick = async () => {
  if (!confirm("清零累计和排行时段数据？连接记录文件不会删除。")) return;
  await fetch("/api/reset", { method: "POST" });
  opened.clear();
  tick();
};
function query() { return (document.getElementById("q").value || "").trim().toLowerCase(); }
function hit(...parts) {
  const q = query();
  if (!q) return true;
  return parts.some(p => String(p || "").toLowerCase().includes(q));
}
function labelOf(p, title) { return title || NAMES[p] || p; }
function prefs() { return (last && last.prefs) || { ignored: [], pinned: [] }; }
function isIgnored(p) {
  const n = String(p || "").toLowerCase();
  return (prefs().ignored || []).some(x => String(x).toLowerCase() === n);
}
function isPinned(p) {
  const n = String(p || "").toLowerCase();
  return (prefs().pinned || []).some(x => String(x).toLowerCase() === n);
}
function iconImg(p) {
  return `<img alt="" src="/api/icon?p=${encodeURIComponent(p)}" onerror="this.remove()">`;
}
function procCell(r, extra) {
  const name = r.process;
  const pin = isPinned(name);
  const ign = isIgnored(name);
  const extraHtml = extra || "";
  return `<span class="app">${pin ? `<span class="pinned-mark">钉</span>` : ""}${iconImg(name)}<span>${escapeHtml(labelOf(name, r.title))}</span></span>${extraHtml}<span class="row-act"><button type="button" data-pin="${escapeHtml(name)}" data-on="${pin ? "0" : "1"}">${pin ? "取消钉" : "钉住"}</button> <button type="button" data-ignore="${escapeHtml(name)}" data-on="${ign ? "0" : "1"}">${ign ? "显示" : "忽略"}</button></span>`;
}
function arrangeRows(rows) {
  const show = document.getElementById("show-ignored") && document.getElementById("show-ignored").checked;
  let out = rows.filter(r => show || !isIgnored(r.process));
  const pin = (prefs().pinned || []).map(x => String(x).toLowerCase());
  out.sort((a, b) => {
    const av = pin.indexOf(String(a.process).toLowerCase());
    const bv = pin.indexOf(String(b.process).toLowerCase());
    const ap = av === -1 ? 999 : av;
    const bp = bv === -1 ? 999 : bv;
    if (ap !== bp) return ap - bp;
    return 0;
  });
  return out;
}
async function savePref(process, patch) {
  await fetch("/api/settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ process, ...patch })
  });
  try { settingsCache = await (await fetch("/api/settings")).json(); } catch {}
  tick();
}
function fmtBytes(n) {
  n = Number(n || 0);
  if (!n) return "0";
  const u = ["B","KB","MB","GB","TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? Math.round(n) : n.toFixed(1)) + " " + u[i];
}
function fmtQuota(n) {
  n = Number(n || 0);
  if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(2) + " GB";
  return fmtBytes(n);
}
function fmtSpeed(n) {
  n = Number(n || 0);
  if (n < 1) return "0";
  return fmtBytes(n) + "/s";
}
function drawChart() {
  const hist = (last && last.history) || [];
  const canvas = document.getElementById("chart");
  const tip = document.getElementById("chart-tip");
  if (!canvas) return;
  const wrap = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(wrap.clientWidth, 120);
  const h = 120;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const pad = { l: 8, r: 8, t: 8, b: 16 };
  if (hist.length < 2) {
    ctx.fillStyle = "#6b6b6b";
    ctx.fillText("还没有速率样本", pad.l, 60);
    if (tip) tip.hidden = true;
    return;
  }
  const pd = hist.map(p => Number(p.proxy_down || 0));
  const dd = hist.map(p => Number(p.direct_down || 0));
  const up = hist.map(p => Number(p.up || 0));
  const stack = pd.map((v, i) => v + dd[i]);
  const max = Math.max(1, ...stack, ...up);
  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;
  const xAt = i => pad.l + (i / (hist.length - 1)) * innerW;
  const yAt = v => pad.t + innerH - (v / max) * innerH;
  function band(bottom, top, color) {
    ctx.beginPath();
    ctx.moveTo(xAt(0), yAt(bottom[0]));
    for (let i = 1; i < hist.length; i++) ctx.lineTo(xAt(i), yAt(bottom[i]));
    for (let i = hist.length - 1; i >= 0; i--) ctx.lineTo(xAt(i), yAt(top[i]));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
  const zero = dd.map(() => 0);
  band(zero, dd, "rgba(16,124,16,0.28)");
  band(dd, stack, "rgba(0,120,212,0.32)");
  ctx.beginPath();
  ctx.moveTo(xAt(0), yAt(up[0]));
  for (let i = 1; i < hist.length; i++) ctx.lineTo(xAt(i), yAt(up[i]));
  ctx.strokeStyle = "#c23900";
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.fillStyle = "#6b6b6b";
  ctx.fillText(fmtBytes(max) + "/s", pad.l, 12);
  if (hoverIdx >= 0 && hoverIdx < hist.length && tip) {
    const hx = xAt(hoverIdx);
    ctx.strokeStyle = "#bbb";
    ctx.beginPath(); ctx.moveTo(hx, pad.t); ctx.lineTo(hx, pad.t + innerH); ctx.stroke();
    const p = hist[hoverIdx];
    tip.hidden = false;
    tip.innerHTML = `代理 ${fmtBytes(p.proxy_down)}/s · 直连 ${fmtBytes(p.direct_down)}/s · 上传 ${fmtBytes(p.up)}/s`;
    tip.style.left = Math.min(Math.max(hx + 8, 8), w - 280) + "px";
  } else if (tip) tip.hidden = true;
}
function whyOf(p) {
  const cmd = (p && (p.cmd || p.path)) || "";
  return cmd ? `<div class="meta">${escapeHtml(cmd)}</div>` : "";
}
function rankSiteRows(r, proxyMode) {
  const sites = r.sites || [];
  const key = "rank:" + r.process;
  const open = opened.has(key);
  const kids = (!sites.length || !open) ? [] : sites.map(s => {
    const pup = Number(s.proxy_up || 0);
    const pdown = Number(s.proxy_down || 0);
    const tot = Number(s.download || 0) + Number(s.upload || 0);
    if (proxyMode) {
      if (!pup && !pdown) return "";
      return `<tr class="site">
        <td></td>
        <td>${escapeHtml(s.site)}</td>
        <td class="num proxy">${fmtBytes(pdown)}</td>
        <td class="num up">${fmtBytes(pup)}</td>
        <td class="num">${fmtBytes(pdown + pup)}</td>
        <td></td>
      </tr>`;
    }
    return `<tr class="site">
      <td></td>
      <td>${escapeHtml(s.site)}</td>
      <td class="num proxy">${fmtBytes(s.proxy_down)}</td>
      <td class="num down">${fmtBytes(s.direct_down)}</td>
      <td class="num up">${fmtBytes(s.upload)}</td>
      <td class="num">${fmtBytes(tot)}</td>
      <td></td>
    </tr>`;
  }).filter(Boolean);
  return { key, sites, open, kids };
}
function sortRows(rows) {
  const mode = document.getElementById("sort").value;
  const copy = rows.slice();
  if (mode === "name") copy.sort((a, b) => labelOf(a.process, a.title).localeCompare(labelOf(b.process, b.title), "zh"));
  else if (mode === "speed") copy.sort((a, b) => (b.down_speed + b.up_speed) - (a.down_speed + a.up_speed));
  else copy.sort((a, b) => (b.download + b.upload) - (a.download + a.upload));
  return copy;
}
function renderRank() {
  const pack = ((last.rank || {})[period]) || { rows: [], upload: 0, download: 0 };
  const proxyTot = Number(pack.proxy_download || 0) + Number(pack.proxy_upload || 0);
  const allTot = Number(pack.download || 0) + Number(pack.upload || 0);
  const label = (PERIODS.find(p => p[0] === period) || [])[1] || "";
  const q = query();
  const proxyMode = rankMode === "proxy";
  let rows = (pack.rows || []).slice();
  if (proxyMode) rows = rows.filter(r => Number(r.proxy_total || (r.proxy_up + r.proxy_down)) > 0);
  if (q) rows = rows.filter(r => hit(r.process, labelOf(r.process, r.title), r.title));
  if (proxyMode) {
    rows.sort((a, b) => Number(b.proxy_total || (b.proxy_up + b.proxy_down)) - Number(a.proxy_total || (a.proxy_up + a.proxy_down)));
  }
  rows = arrangeRows(rows);
  const sum = `<p class="sum">${label} 代理 ${fmtBytes(proxyTot)}（↓ ${fmtBytes(pack.proxy_download || 0)} · ↑ ${fmtBytes(pack.proxy_upload || 0)}） · 直连 ${fmtBytes(allTot - proxyTot)} · ${rows.length} 个程序</p>`;
  if (rankMode === "node") {
    const packN = pack.nodes || { rows: [], upload: 0, download: 0 };
    let nrows = (packN.rows || []).slice();
    if (q) nrows = nrows.filter(r => hit(r.node));
    const ntot = Number(packN.download || 0) + Number(packN.upload || 0);
    const nsum = `<p class="sum">${label} 走代理节点合计 ${fmtBytes(ntot)}（↓ ${fmtBytes(packN.download || 0)} · ↑ ${fmtBytes(packN.upload || 0)}） · ${nrows.length} 个节点</p>`;
    if (!nrows.length) return `${nsum}<div class="empty">这段时间还没有节点流量</div>`;
    const max = Math.max(1, ...nrows.map(r => r.download + r.upload));
    return `${nsum}
      <table>
        <thead><tr><th class="rk">#</th><th>节点</th><th class="num">下载</th><th class="num">上传</th><th class="num">合计</th><th class="num hide-sm">占比</th></tr></thead>
        <tbody>${nrows.map((r, i) => {
          const tot = r.download + r.upload;
          const pct = Math.max(2, Math.round(100 * tot / max));
          return `<tr>
            <td class="rk">${i + 1}</td>
            <td>${escapeHtml(r.node)}<span class="bar"><i style="width:${pct}%"></i></span></td>
            <td class="num proxy">${fmtBytes(r.download)}</td>
            <td class="num up">${fmtBytes(r.upload)}</td>
            <td class="num">${fmtBytes(tot)}</td>
            <td class="num hide-sm">${r.share || 0}%</td>
          </tr>`;
        }).join("")}</tbody>
      </table>`;
  }
  if (rankMode === "site") {
    const packS = pack.sites || { rows: [], upload: 0, download: 0 };

function laneTable(kind, lane) {

    if (!query()) return true;

  })));
  if (!rows.length) return `<tr><td class="empty" colspan="3">没有程序</td></tr>`;
  return rows.flatMap(p => {

    const extra = [sites.length ? sites.length + " 站" : "", p.live ? p.live + " 在连" : ""].filter(Boolean).join(" · ");
    const main = `<tr class="${sites.length ? "foldable" : ""}" data-key="${escapeHtml(key)}">

      <td>${escapeHtml(s.site)}</td>

async function doUpdate() {
  const btn = document.getElementById("btn-update");
  if (!btn || btn.dataset.busy === "1") return;
  const old = btn.textContent;
  btn.dataset.busy = "1";
  btn.disabled = true;
  const status = document.getElementById("status");
  try {
    btn.textContent = "检查中…";
    updateInfo = await (await fetch("/api/update")).json();
    if (updateInfo && updateInfo.error && !updateInfo.latest) throw new Error(updateInfo.error);
    if (updateInfo && !updateInfo.newer) {
      btn.classList.remove("fresh");
      btn.textContent = "已是最新";
      if (status) status.textContent = "已是最新版本 v" + (updateInfo.current || "");
      return;
    }
    btn.textContent = "下载中…";
    if (status) status.textContent = "正在下载 GitHub 最新版…";
    const r = await fetch("/api/update", { method: "POST" });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || "更新失败");
    btn.textContent = "正在重启…";
    if (status) status.textContent = "已下载 v" + (d.latest || "") + "，即将重启";
    setTimeout(() => location.reload(), 5000);
  } catch (e) {
    btn.textContent = "更新失败";
    if (status) status.textContent = "更新失败 " + e.message;
    setTimeout(() => {
      btn.textContent = old;
      btn.dataset.busy = "";
      btn.disabled = false;
    }, 2500);
    return;
  } finally {
    if (btn.textContent !== "正在重启…" && btn.textContent !== "更新失败") {
      btn.dataset.busy = "";
      btn.disabled = false;
    }
  }
}

function setFilter(id) {
  filter = id;
  [...box.children].forEach(x => x.classList.toggle("on", x.textContent === (FILTERS.find(f => f[0] === id) || [])[1]));
  render();
}
document.getElementById("airport").addEventListener("click", async (e) => {
  if (!e.target.closest("[data-refresh-sub]")) return;
  await fetch("/api/refresh-sub", { method: "POST" });
  setTimeout(tick, 800);
});
document.getElementById("quota").addEventListener("click", async (e) => {
  if (e.target.closest("[data-open-leaks]")) {
    leakOnly = true;
    setFilter("conns");
    return;
  }
  const ack = e.target.closest("[data-ack-new]");
  if (ack) {
    await fetch("/api/ack-new", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ process: ack.dataset.ackNew || "" })
    });
    tick();
  }
});
document.getElementById("show-ignored").onchange = () => render();
document.getElementById("main").addEventListener("click", (e) => {
  const ign = e.target.closest("[data-ignore]");
  if (ign) {
    e.stopPropagation();
    savePref(ign.dataset.ignore, { ignored: ign.dataset.on === "1" });
    return;
  }
  const pin = e.target.closest("[data-pin]");
  if (pin) {
    e.stopPropagation();
    savePref(pin.dataset.pin, { pinned: pin.dataset.on === "1" });
    return;
  }
  const btn = e.target.closest("[data-close]");
  if (btn) {
    const ids = (btn.dataset.close || "").split(",").filter(Boolean);
    fetch("/api/close", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids })
    }).then(() => tick());
    return;
  }
  if (filter !== "lanes" && filter !== "rank") return;
  const tr = e.target.closest("tr.foldable");
  if (!tr) return;
  const key = tr.dataset.key;
  if (!key) return;
  if (opened.has(key)) opened.delete(key); else opened.add(key);
  render();
});
(function bindChart() {
  const canvas = document.getElementById("chart");
  canvas.addEventListener("mousemove", (e) => {
    const hist = (last && last.history) || [];
    if (hist.length < 2) return;
    const rect = canvas.getBoundingClientRect();
    const t = (e.clientX - rect.left) / Math.max(rect.width, 1);
    hoverIdx = Math.round(Math.max(0, Math.min(1, t)) * (hist.length - 1));
    drawChart();
  });
  canvas.addEventListener("mouseleave", () => { hoverIdx = -1; drawChart(); });
  window.addEventListener("resize", () => drawChart());
})();
tick();
setInterval(tick, 2000);
document.getElementById("btn-update").onclick = doUpdate;
peekUpdate();
</script>
