<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Monitor</title>
<style>
  :root {
    --bg: #eef2f6;
    --panel: #fff;
    --line: #d8dee6;
    --ink: #1b1f24;
    --mute: #5b6570;
    --proxy: #0078d4;
    --direct: #107c10;
    --up: #c23900;
    --bar: #e2e7ee;
    --sel: #dff0ff;
    --chip: #f4f7fa;
    --leak: #c42b1c;
    --warn: #fff8e1;
    --warn-line: #e0c36e;
    --shadow: 0 1px 2px rgba(27, 31, 36, 0.05);
    --mono: "Cascadia Mono", "Segoe UI Variable", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 13px/1.45 "Segoe UI Variable", "Segoe UI", "PingFang SC", sans-serif;
    letter-spacing: 0.01em;
  }
  button, input, select { font: inherit; color: inherit; }
  button, input, select { border-radius: 7px; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--proxy);
    outline-offset: 2px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 14px 18px 36px; }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .mark {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    background: linear-gradient(135deg, #0078d4 0%, #5bb0ff 100%);
    box-shadow: inset 0 -6px 0 rgba(255,255,255,0.18);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
  .brand .ver { color: var(--mute); font-size: 11px; font-family: var(--mono); }
  .nav {
    display: flex; gap: 2px; padding: 3px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow);
  }
  .nav button {
    background: transparent; border: 0;
    padding: 6px 12px; color: var(--mute);
  }
  .nav button.on {
    background: var(--sel); color: var(--proxy); font-weight: 600;
  }
  .period {
    display: flex; gap: 2px; flex-wrap: wrap; padding: 2px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
  }
  .period button {
    background: transparent; border: 0;
    padding: 4px 9px; color: var(--mute);
  }
  .period button.on {
    background: var(--sel); color: var(--proxy); font-weight: 600;
  }
  .tools > button, .tools > select, header .upd, .act button,
  .airport button, .quota button, .settings button, .row-act button {
    background: var(--panel); border: 1px solid var(--line);
    padding: 5px 10px;
  }
  .search { flex: 1; min-width: 160px; }
  .search input {
    width: 100%; height: 34px;
    border: 1px solid var(--line); padding: 0 12px;
    background: var(--panel); box-shadow: var(--shadow);
  }
  .rates {
    font-family: var(--mono);
    font-size: 18px; font-weight: 600; line-height: 1.2;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
  }
  .rates .dn { color: var(--ink); }
  header .upd { height: 34px; white-space: nowrap; }
  header .upd.fresh {
    background: var(--proxy); color: #fff; border-color: var(--proxy);
  }
  .meta {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    color: var(--mute); font-size: 12px; margin: 0 0 10px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 99px; padding: 2px 8px;
    box-shadow: var(--shadow);
  }
  .chip.ok { color: var(--direct); }
  .chip.warn { color: #8a6d00; background: var(--warn); border-color: var(--warn-line); }
  .chip.bad { color: var(--leak); }
  .setup {
    padding: 16px 18px; margin: 0 0 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow);
  }
  .setup h2 { margin: 0 0 8px; font-size: 15px; }
  .setup ol { margin: 8px 0 12px; padding-left: 20px; color: var(--ink); }
  .setup .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin: 10px 0;
  }
  .tools > select { height: 30px; background: var(--panel); }
  .check {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--mute); user-select: none;
  }
  .chart-box, .live, .airport, .quota, .settings, #main > table, .lanes > div {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .chart-box { margin-bottom: 12px; overflow: hidden; }
  .chart-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px 0; color: var(--mute); font-size: 12px;
  }
  .legend { display: flex; gap: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend span::before {
    content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor;
  }
  .chart-wrap { position: relative; }
  #chart { display: block; width: 100%; height: 128px; }
  #chart-tip {
    position: absolute; top: 8px; left: 8px; background: #fff;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 8px; font-size: 11px; font-family: var(--mono);
    font-variant-numeric: tabular-nums; pointer-events: none;
    box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  #main > table { overflow: hidden; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th {
    color: var(--mute); font-weight: 600; font-size: 11px;
    letter-spacing: 0.04em; background: #f7f9fb;
  }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #f5f9fd; }
  .num {
    text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;
    font-family: var(--mono); font-size: 12px;
  }
  .bar { display: block; height: 3px; background: var(--bar); margin-top: 6px; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--proxy); }
  .bar i.d { background: var(--direct); }
  .rk { color: var(--mute); width: 2.2em; font-family: var(--mono); font-size: 12px; }
  .foldable { cursor: pointer; }
  .site td:nth-child(2) { padding-left: 36px; color: var(--mute); }
  .empty { color: var(--mute); padding: 36px 16px; text-align: center; }
  .down { color: var(--direct); }
  .proxy { color: var(--proxy); }
  .up { color: var(--up); }
  .sum { color: var(--mute); font-size: 12px; margin: 0 0 8px; padding: 0 2px; }
  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lanes > div { padding: 10px 10px 4px; overflow: hidden; }
  .lanes .sum { padding: 2px 6px 8px; }
  .lanes table { background: transparent; }
  .settings {
    display: grid; grid-template-columns: 168px 1fr;
    padding: 0; max-width: 860px; overflow: hidden;
  }
  .set-nav {
    background: #f7f9fb; border-right: 1px solid var(--line);
    padding: 10px 8px;
  }
  .set-nav button {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 0;
    padding: 8px 10px; color: var(--mute);
  }
  .set-nav button.on { background: var(--sel); color: var(--proxy); font-weight: 600; }
  .set-body { padding: 18px 20px 22px; min-width: 0; }
  .set-body .acts, .setup .acts { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .settings h2 { margin: 20px 0 8px; font-size: 13px; font-weight: 600; }
  .settings h2:first-child { margin-top: 0; }
  .about-hero { margin: 0 0 14px; }
  .about-hero h3 { margin: 0 0 4px; font-size: 18px; }
  .kbd { font-family: var(--mono); font-size: 11px; background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .settings .row { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; cursor: pointer; }
  .settings .row input { margin-top: 3px; }
  .settings .hint { color: var(--mute); font-size: 12px; margin: 2px 0 0; }
  .settings .field { margin: 12px 0; }
  .settings .field label { display: block; margin-bottom: 5px; }
  .settings input[type=text], .settings input[type=number], .settings input[type=password] {
    width: 100%; border: 1px solid var(--line); padding: 7px 10px; background: #fff;
  }
  .settings .path { font-family: var(--mono); font-size: 12px; word-break: break-all; color: var(--mute); }
  .settings .ok { color: var(--direct); font-size: 12px; margin-left: 8px; }
  .settings .err { color: var(--leak); font-size: 12px; }
  .quota { background: var(--warn); border-color: var(--warn-line); padding: 10px 12px; margin: 0 0 10px; }
  .quota p { margin: 0 0 4px; }
  .quota p:last-child { margin: 0; }
  .quota .leak-line { color: var(--leak); cursor: pointer; }
  .quota .new-line button { margin-left: 8px; padding: 2px 8px; }
  .airport { padding: 10px 14px; margin: 0 0 10px; }
  .airport p { margin: 0 0 4px; }
  .airport p:last-child { margin: 0; }
  .airport .hint { color: var(--mute); font-size: 12px; }
  .airport .bar { margin-top: 8px; }
  .airport button { margin-left: 8px; padding: 2px 8px; }
  .airport .head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  .airport .head p { margin: 0; flex: 1; }
  .airport .head .acts { display: flex; gap: 6px; flex: none; }
  .airport .head .acts button { margin-left: 0; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #1b1f24; color: #fff; padding: 8px 14px;
    border-radius: 8px; font-size: 13px; z-index: 40;
    box-shadow: 0 8px 24px rgba(27, 31, 36, 0.22);
    max-width: min(420px, calc(100vw - 32px));
  }
  .leak-tag { color: var(--leak); font-weight: 600; }
  .pill {
    display: inline-flex; align-items: center;
    padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 600;
  }
  .pill.proxy { background: #e8f4fc; color: var(--proxy); }
  .pill.direct { background: #eaf6ea; color: var(--direct); }
  .pill.leak { background: #fde7e9; color: var(--leak); }
  .act { text-align: right; white-space: nowrap; width: 3.5em; }
  .live { padding: 14px 16px 12px; margin-bottom: 10px; }
  .pipe-track {
    display: flex; height: 12px; background: var(--bar);
    overflow: hidden; border-radius: 99px;
    box-shadow: inset 0 1px 2px rgba(27, 31, 36, 0.12);
  }
  .pipe-track i { display: block; height: 100%; }
  .pipe-track .proxy { background: var(--proxy); }
  .pipe-track .direct { background: var(--direct); }
  .pipe-track i { transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .pipe-meta {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin-top: 10px; font-variant-numeric: tabular-nums;
  }
  .pipe-meta .split { color: var(--mute); font-size: 12px; }
  .eaters {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 10px; min-height: 28px;
  }
  .eaters .who {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip); border: 1px solid var(--line);
    border-radius: 99px; padding: 4px 10px 4px 5px;
  }
  .app { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .eaters .who img, .app img {
    width: 18px; height: 18px; flex: none; border-radius: 4px;
  }
  .eaters .who .spd, .num {
    font-variant-numeric: tabular-nums;
  }
  .eaters .who .spd { font-family: var(--mono); font-size: 12px; }
  .eaters .idle { color: var(--mute); padding: 4px 2px; }
  .proc-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .proc .fold {
    color: var(--mute); margin-left: 4px; font-family: var(--mono);
  }
  .proc .meta { margin: 3px 0 0; font-size: 11px; }
  .row-act { display: inline-flex; gap: 4px; flex: none; opacity: 0.4; }
  tr:hover .row-act, .proc-head:hover .row-act { opacity: 1; }
  .row-act button { padding: 1px 7px; font-size: 11px; }
  .pinned-mark { color: var(--proxy); font-size: 11px; }
  .settings .ign-list { list-style: none; padding: 0; margin: 8px 0 0; }
  .settings .ign-list li {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .settings .ign-list li:last-child { border-bottom: 0; }
  .settings .ign-list button { padding: 3px 8px; }
  @media (max-width: 800px) {
    .hide-sm { display: none; }
    .lanes { grid-template-columns: 1fr; }
    .rates { font-size: 16px; }
    .settings { grid-template-columns: 1fr; }
    .set-nav { display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line); }
    .set-nav button { width: auto; }
    .brand .ver { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pipe-track i { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div class="brand-text">
        <h1>Flash Monitor</h1>
        <span class="ver" id="brand-ver"></span>
      </div>
    </div>
    <nav class="nav" id="filters"></nav>
    <label class="search"><input id="q" type="search" placeholder="搜索程序或网站" autocomplete="off"></label>
    <button type="button" class="upd" id="btn-update">更新</button>
  </header>
  <div class="meta" id="status"><span class="chip">正在启动…</span></div>
  <div id="setup" class="setup" hidden></div>
  <section class="live" id="live">
    <div class="pipe-track" id="pipe"><i class="proxy" id="pipe-proxy" style="width:0"></i><i class="direct" id="pipe-direct" style="width:0"></i></div>
    <div class="pipe-meta">
      <span class="rates" id="rates"></span>
      <span class="split" id="split-lab"></span>
    </div>
    <div class="eaters" id="eaters"></div>
  </section>
  <div id="airport" class="airport" hidden></div>
  <div id="quota" class="quota" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div class="tools">
    <div class="period" id="rank-modes"></div>
    <div class="period" id="periods"></div>
    <select id="sort">
      <option value="traffic">按流量</option>
      <option value="speed">按速率</option>
      <option value="name">按名称</option>
    </select>
    <button type="button" id="btn-export">导出 CSV</button>
    <button type="button" id="btn-reset">清零累计</button>
    <label class="check">
      <input type="checkbox" id="show-ignored"> 显示已忽略
    </label>
  </div>
  <section class="chart-box">
    <div class="chart-head">
      <span>速率</span>
      <div class="legend">
        <span class="proxy">代理↓</span>
        <span class="down">直连↓</span>
        <span class="up">上传↑</span>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <div id="chart-tip" hidden></div>
    </div>
  </section>
  <div id="main"></div>
</div>
<script>
const FILTERS = [["rank","排行"],["lanes","分流"],["conns","连接"],["closed","已结束"],["settings","设置"]];
const PERIODS = [["1h","近 1 小时"],["today","今天"],["7d","近 7 天"],["30d","近 30 天"],["all","累计"]];
const NAMES = {
  msedge:"Edge", chrome:"Chrome", firefox:"Firefox", msedgewebview2:"WebView",
  Weixin:"微信", WeChatAppEx:"微信", JianyingPro:"剪映", language_server:"Antigravity",
  Cursor:"Cursor", steam:"Steam", python:"Python", ssh:"SSH",
  node:"Node.js",
  MpDefenderCoreService:"Defender"
};
let filter = "rank";
let period = "today";
let rankMode = "proxy";
let setPane = "general";
let leakOnly = false;
let last = null;
let settingsCache = null;
let settingsNote = "";
let updateInfo = null;
let clashNote = "";
const opened = new Set();
let hoverIdx = -1;
const box = document.getElementById("filters");
FILTERS.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.textContent = label;
  if (id === filter) b.className = "on";
  b.onclick = async () => {
    await gotoFilter(id);
  };
  box.appendChild(b);
});
const RANK_MODES = [["proxy","代理用量"],["node","节点"],["site","网站"],["all","全部流量"]];
const mbox = document.getElementById("rank-modes");
RANK_MODES.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.textContent = label;
  if (id === rankMode) b.className = "on";
  b.onclick = () => {
    rankMode = id;
    [...mbox.children].forEach(x => x.classList.toggle("on", x.textContent === label));
    render();
  };
  mbox.appendChild(b);
});
const pbox = document.getElementById("periods");
PERIODS.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.textContent = label;
  if (id === period) b.className = "on";
  b.onclick = () => {
    period = id;
    [...pbox.children].forEach(x => x.classList.toggle("on", x.textContent === label));
    saveSetting("last_period", period, true);
    render();
  };
  pbox.appendChild(b);
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
document.getElementById("btn-export").onclick = async () => {
  const r = await fetch("/api/export.csv");
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tun-split.csv";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("btn-reset").onclick = async () => {
  if (!confirm("清零累计和排行时段数据？连接记录文件不会删除。")) return;
  await fetch("/api/reset", { method: "POST" });
  opened.clear();
  tick();
};
function query() { return (document.getElementById("q").value || "").trim().toLowerCase(); }
function hit(...parts) {
  const q = query();
  if (!q) return true;
  return parts.some(p => String(p || "").toLowerCase().includes(q));
}
function labelOf(p, title) { return title || NAMES[p] || p; }
function prefs() { return (last && last.prefs) || { ignored: [], pinned: [], show_airport: true, show_new_banner: true }; }
function airportOn() {
  if (settingsCache && Object.prototype.hasOwnProperty.call(settingsCache, "show_airport")) {
    return settingsCache.show_airport !== false;
  }
  return prefs().show_airport !== false;
}
let toastTimer = 0;
function flashToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}
function isIgnored(p) {
  const n = String(p || "").toLowerCase();
  return (prefs().ignored || []).some(x => String(x).toLowerCase() === n);
}
function isPinned(p) {
  const n = String(p || "").toLowerCase();
  return (prefs().pinned || []).some(x => String(x).toLowerCase() === n);
}
function iconImg(p) {
  return `<img alt="" src="/api/icon?p=${encodeURIComponent(p)}" onerror="this.remove()">`;
}
function procCell(r, extra, fold) {
  const name = r.process;
  const pin = isPinned(name);
  const ign = isIgnored(name);
  const extraHtml = extra || "";
  const foldHtml = fold ? `<span class="fold">${escapeHtml(fold)}</span>` : "";
  return `<div class="proc"><div class="proc-head"><span class="app">${pin ? `<span class="pinned-mark">钉</span>` : ""}${iconImg(name)}<span class="nm">${escapeHtml(labelOf(name, r.title))}</span>${foldHtml}</span><span class="row-act"><button type="button" data-pin="${escapeHtml(name)}" data-on="${pin ? "0" : "1"}">${pin ? "取消钉" : "钉住"}</button> <button type="button" data-ignore="${escapeHtml(name)}" data-on="${ign ? "0" : "1"}">${ign ? "显示" : "忽略"}</button></span></div>${extraHtml}</div>`;
}
function arrangeRows(rows) {
  const show = document.getElementById("show-ignored") && document.getElementById("show-ignored").checked;
  let out = rows.filter(r => show || !isIgnored(r.process));
  const pin = (prefs().pinned || []).map(x => String(x).toLowerCase());
  out.sort((a, b) => {
    const av = pin.indexOf(String(a.process).toLowerCase());
    const bv = pin.indexOf(String(b.process).toLowerCase());
    const ap = av === -1 ? 999 : av;
    const bp = bv === -1 ? 999 : bv;
    if (ap !== bp) return ap - bp;
    return 0;
  });
  return out;
}
async function savePref(process, patch) {
  await fetch("/api/settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ process, ...patch })
  });
  try { settingsCache = await (await fetch("/api/settings")).json(); } catch {}
  tick();
}
function fmtBytes(n) {
  n = Number(n || 0);
  if (!n) return "0";
  const u = ["B","KB","MB","GB","TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? Math.round(n) : n.toFixed(1)) + " " + u[i];
}
function fmtQuota(n) {
  n = Number(n || 0);

function drawChart() {

  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(wrap.clientWidth, 120);
  const h = 128;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const pad = { l: 8, r: 8, t: 8, b: 16 };
  if (hist.length < 2) {
    ctx.fillStyle = "#6b6b6b";
    ctx.fillText("还没有速率样本", pad.l, 60);
    if (tip) tip.hidden = true;
    return;
  }
  const pd = hist.map(p => Number(p.proxy_down || 0));
  const dd = hist.map(p => Number(p.direct_down || 0));
  const up = hist.map(p => Number(p.up || 0));
  const stack = pd.map((v, i) => v + dd[i]);
  const max = Math.max(1, ...stack, ...up);
  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;
  const xAt = i => pad.l + (i / (hist.length - 1)) * innerW;
  const yAt = v => pad.t + innerH - (v / max) * innerH;

    ctx.beginPath();
    ctx.moveTo(xAt(0), yAt(bottom[0]));
    for (let i = 1; i < hist.length; i++) ctx.lineTo(xAt(i), yAt(bottom[i]));
    for (let i = hist.length - 1; i >= 0; i--) ctx.lineTo(xAt(i), yAt(top[i]));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
  const zero = dd.map(() => 0);
  band(zero, dd, "rgba(16,124,16,0.28)");
  band(dd, stack, "rgba(0,120,212,0.32)");
  ctx.beginPath();
  ctx.moveTo(xAt(0), yAt(up[0]));
  for (let i = 1; i < hist.length; i++) ctx.lineTo(xAt(i), yAt(up[i]));
  ctx.strokeStyle = "#c23900";
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.fillStyle = "#6b6b6b";
  ctx.fillText(fmtBytes(max) + "/s", pad.l, 12);
  if (hoverIdx >= 0 && hoverIdx < hist.length && tip) {
    const hx = xAt(hoverIdx);
    ctx.strokeStyle = "#bbb";
    ctx.beginPath(); ctx.moveTo(hx, pad.t); ctx.lineTo(hx, pad.t + innerH); ctx.stroke();
    const p = hist[hoverIdx];
    tip.hidden = false;
    tip.innerHTML = `代理 ${fmtBytes(p.proxy_down)}/s · 直连 ${fmtBytes(p.direct_down)}/s · 上传 ${fmtBytes(p.up)}/s`;
    tip.style.left = Math.min(Math.max(hx + 8, 8), w - 280) + "px";

}

async function gotoFilter(id, pane) {

  if (pane) setPane = pane;
  [...box.children].forEach(x => x.classList.toggle("on", x.textContent === (FILTERS.find(f => f[0] === id) || [])[1]));

function applyHash() {
  const raw = (location.hash || "").replace(/^#/, "");
  if (!raw) return;
  const [head, pane] = raw.split("/");
  if (FILTERS.some(f => f[0] === head)) filter = head;
  if (head === "settings" && pane) setPane = pane;

async function peekUpdate() {
  try {
    updateInfo = await (await fetch("/api/update")).json();
    const btn = document.getElementById("btn-update");
    if (!btn || btn.dataset.busy === "1") return;
    if (updateInfo && updateInfo.newer) {
      btn.classList.add("fresh");
      btn.textContent = "有新版本";
    } else {
      btn.classList.remove("fresh");
      btn.textContent = "更新";
    }
    if (filter === "settings") render();
  } catch {}
}
async function doUpdate() {
  const btn = document.getElementById("btn-update");
  if (!btn || btn.dataset.busy === "1") return;
  const old = btn.textContent;
  btn.dataset.busy = "1";
  btn.disabled = true;
  const status = document.getElementById("status");
  try {
    btn.textContent = "检查中…";
    updateInfo = await (await fetch("/api/update")).json();
    if (updateInfo && updateInfo.error && !updateInfo.latest) throw new Error(updateInfo.error);
    if (updateInfo && !updateInfo.newer) {
      btn.classList.remove("fresh");
      btn.textContent = "已是最新";
      if (status) status.textContent = "已是最新版本 v" + (updateInfo.current || "");
      return;
    }
    btn.textContent = "下载中…";
    if (status) status.textContent = "正在下载 GitHub 最新版…";
    const r = await fetch("/api/update", { method: "POST" });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || "更新失败");
    btn.textContent = "正在重启…";
    if (status) status.textContent = "已下载 v" + (d.latest || "") + "，即将重启";
    setTimeout(() => location.reload(), 5000);
  } catch (e) {
    btn.textContent = "更新失败";
    if (status) status.textContent = "更新失败 " + e.message;
    setTimeout(() => {
      btn.textContent = old;
      btn.dataset.busy = "";
      btn.disabled = false;
    }, 2500);
    return;
  } finally {
    if (btn.textContent !== "正在重启…" && btn.textContent !== "更新失败") {
      btn.dataset.busy = "";
      btn.disabled = false;
    }
  }
}

        <div>关窗口藏到托盘时提醒还在采集</div>
      </label>
      <h2>日流量阈值</h2>
      <div class="field">
        <label>今天合计超过（MB，0 表示关闭）</label>
        <input type="number" min="0" step="1" value="${Number(s.quota_total_mb || 0)}" onchange="saveSetting('quota_total_mb', Number(this.value))">
      </div>
      <div class="field">
        <label>单个程序今天超过（MB，0 表示关闭）</label>
        <input type="number" min="0" step="1" value="${Number(s.quota_program_mb || 0)}" onchange="saveSetting('quota_program_mb', Number(this.value))">
      </div>`;
  } else if (setPane === "connect") {
    body = `
      <h2>Clash</h2>
      <div class="field">
        <label>外部控制器</label>
        <input type="text" value="${escapeHtml(s.clash_api || "")}" onchange="saveSetting('clash_api', this.value)">
        <div class="hint">默认 http://127.0.0.1:9090。FlClash / Clash Verge 需先打开外部控制器。TUN 不是必须的。</div>
      </div>
      <div class="field">
        <label>密钥（可选）</label>
        <input type="password" value="${escapeHtml(s.clash_secret || "")}" autocomplete="off" onchange="saveSetting('clash_secret', this.value)">
      </div>
      <div class="acts"><button type="button" onclick="testClash()">测试连接</button></div>
      ${clashNote ? `<p class="${clashNote.startsWith("已接通") ? "ok" : "hint"}">${escapeHtml(clashNote)}</p>` : ""}
      <h2>机场账期</h2>
      <div class="field">
        <label>原始订阅地址（可选）</label>
        <input type="password" value="${escapeHtml(s.sub_url || "")}" autocomplete="off" onchange="saveSetting('sub_url', this.value)">
        <div class="hint">填机场给 Clash 的原始订阅。转换器链接通常没有已用/总量。</div>
      </div>
      <label class="row">
        <input type="checkbox" ${s.show_airport !== false ? "checked" : ""} onchange="saveSetting('show_airport', this.checked)">
        <div>首页显示机场账期</div>
      </label>`;
  } else if (setPane === "data") {
    body = `
      <h2>数据</h2>
      <p class="path">${escapeHtml(s.data_dir || "")}</p>
      <div class="acts">
        <button type="button" onclick="openDataDir()">打开数据文件夹</button>
        <button type="button" onclick="openInstallDir()">打开安装目录</button>
        <button type="button" onclick="copyDiag()">复制诊断信息</button>
      </div>
      <div class="field">
        <label>排行数据保留天数</label>
        <input type="number" min="7" max="365" value="${Number(s.retention_days || 40)}" onchange="saveSetting('retention_days', Number(this.value))">
        <div class="hint">只影响时段排行。连接记录文件不会按这个天数自动删。</div>
      </div>
      <p class="hint">清零累计在排行页。卸载打包版可运行安装目录里的 uninstall.ps1，默认保留流量记录。</p>`;
  } else if (setPane === "about") {
    body = `
      <div class="about-hero">
        <h3>Flash Monitor</h3>
        <p>v${escapeHtml(s.version || "")}${s.frozen ? " · 安装版" : " · 源码运行"} · ${escapeHtml(s.license || "MIT")}</p>
      </div>
      <p>本机监视 FlClash / mihomo 的分流和流量。只监听 127.0.0.1，记录留在这台电脑上。</p>
      <p id="upd-note" class="hint">${updateInfo && updateInfo.latest ? (
        updateInfo.newer
          ? `GitHub 最新 v${escapeHtml(updateInfo.latest)}，点右上角「更新」下载并重启。`
          : `已是最新（GitHub v${escapeHtml(updateInfo.latest || s.version || "")}）。`
      ) : "点右上角「更新」检查 GitHub 发行版。"}</p>
      <div class="acts">
        <button type="button" onclick="doUpdate()">检查更新</button>
        <button type="button" onclick="window.open(${JSON.stringify(s.github || "https://github.com/finnheihei/FlashMonitor")},'_blank')">GitHub</button>
      </div>
      <h2>快捷键</h2>
      <p class="hint"><span class="kbd">1</span>–<span class="kbd">5</span> 切换页面 · <span class="kbd">/</span> 搜索 · <span class="kbd">Esc</span> 清空搜索</p>
      <h2>签名与 Defender</h2>
      <p class="hint">安装版没有代码签名。Defender 若误报 Bearfoos 并删掉 exe，到「Windows 安全中心 → 保护历史记录」允许。流量记录还在数据目录。</p>
      <p class="hint">© 2026 finnheihei · MIT License</p>`;
  } else {
    body = `
      <h2>启动${note}</h2>
      <label class="row">
        <input type="checkbox" ${s.autostart ? "checked" : ""} onchange="saveSetting('autostart', this.checked)">
        <div>开机自启动<div class="hint">写入当前用户启动项。打包版请打开 FlashMonitor.exe 后再勾。</div></div>
      </label>
      <label class="row">
        <input type="checkbox" ${s.start_minimized ? "checked" : ""} onchange="saveSetting('start_minimized', this.checked)">
        <div>启动后藏到托盘</div>
      </label>
      <label class="row">
        <input type="checkbox" ${s.close_to_tray !== false ? "checked" : ""} onchange="saveSetting('close_to_tray', this.checked)">
        <div>关闭窗口藏到托盘<div class="hint">采集继续。彻底退出用托盘「退出 Flash Monitor」。</div></div>
      </label>
      <h2>忽略的程序</h2>
      <p class="hint">忽略后不出现在排行、分流和托盘提示。</p>
      ${ign}`;
  }
  return `<div class="settings" id="set-form"><aside class="set-nav">${nav}</aside><div class="set-body">${body}</div></div>`;
}
function paintLive() {
  const box = document.getElementById("live");
  if (filter === "settings") {
    box.hidden = true;
    return;
  }
  box.hidden = false;
  const live = (last && last.live) || {};
  const pd = Number(live.proxy_down || 0) + Number(live.proxy_up || 0);
  const dd = Number(live.direct_down || 0) + Number(live.direct_up || 0);
  const tot = pd + dd;
  const pp = tot ? Math.round(100 * pd / tot) : 0;
  document.getElementById("pipe-proxy").style.width = (tot ? pp : 0) + "%";
  document.getElementById("pipe-direct").style.width = (tot ? (100 - pp) : 0) + "%";
  document.getElementById("rates").innerHTML = `<span class="dn">↓ ${fmtSpeed(live.down || 0)}</span>  <span class="up">↑ ${fmtSpeed(live.up || 0)}</span>`;
  document.getElementById("split-lab").textContent = tot ? `代理 ${pp}% · 直连 ${100 - pp}%` : "还没流量";
  const eaters = live.eaters || [];
  document.getElementById("eaters").innerHTML = eaters.length
    ? eaters.map(e => {
        const lane = Number(e.proxy_down || 0) >= Number(e.direct_down || 0) ? "proxy" : "direct";
        return `<span class="who">${iconImg(e.process)}<span>${escapeHtml(labelOf(e.process, e.title))}</span><span class="spd ${lane}">${fmtSpeed(Number(e.down || 0) + Number(e.up || 0))}</span></span>`;
      }).join("")
    : `<span class="idle">没有明显在跑的程序</span>`;
}
function paintChrome() {
  if (!last) return;
  const s = last.status || {};
  paintLive();
  const mode = s.mode === "both" || (s.tun_up && s.sysproxy)
    ? "TUN + 系统代理"
    : (s.tun_up || s.mode === "tun")
      ? "TUN 开"
      : (s.sysproxy || s.mode === "sysproxy")
        ? "系统代理"
        : "未接管";
  const chips = [
    `<span class="chip">${escapeHtml(mode)}</span>`,
    s.clash_api ? `<span class="chip ok">已接 Clash</span>` : `<span class="chip warn">未接 Clash</span>`,
    (s.tun_up && s.leak_n ? `<span class="chip bad">漏网 ${s.leak_n}</span>` : ""),
    ((s.nodes || []).length ? `<span class="chip">${escapeHtml((s.nodes || []).join(" · "))}</span>` : `<span class="chip">无节点</span>`),
    (s.version ? `<span class="chip">v${escapeHtml(s.version)}</span>` : ""),
    `<span class="chip">${escapeHtml(new Date((last.ts || 0) * 1000).toLocaleTimeString())}</span>`
  ].filter(Boolean);
  document.getElementById("status").innerHTML = chips.join("");
  const bv = document.getElementById("brand-ver");
  if (bv) bv.textContent = s.version ? "v" + s.version : "";
  paintSetup();
  if (filter === "settings") {
    document.getElementById("airport").hidden = true;
    document.getElementById("quota").hidden = true;
    return;
  }
  const boxA = document.getElementById("airport");
  const sub = last.sub || {};
  const used = Number(sub.used || 0);
  const total = Number(sub.total || 0);
  if (!airportOn()) {
    boxA.hidden = true;
    boxA.innerHTML = "";
  } else {
    const acts = `<span class="acts"><button type="button" data-refresh-sub="1">刷新</button><button type="button" data-hide-airport="1">隐藏</button></span>`;
    if (!total && !used) {
      boxA.hidden = false;
      boxA.innerHTML = `<div class="head"><p><b>机场</b> 还没读到账期流量（你面板上是 已用/总量，上传、下载）</p>${acts}</div>
        <p class="hint">FlClash 当前订阅如果是转换器，通常没有这组头。到「设置」填机场原始 Clash 订阅后，这里会显示和面板一样的数字。本机排行只统计采集到的连接，对不齐是正常的。</p>`;
    } else {
      const pct = total ? Math.min(100, Math.round(1000 * used / total) / 10) : 0;
      let expire = "";
      if (sub.expire) {
        const d = new Date(Number(sub.expire) * 1000);
        if (!Number.isNaN(d.getTime())) expire = " · 到期 " + d.toLocaleDateString("zh-CN");
      }
      const name = sub.label ? escapeHtml(sub.label) + " · " : "";
      boxA.hidden = false;
      boxA.innerHTML = `<div class="head"><p><b>机场</b> ${name}${fmtQuota(used)} / ${fmtQuota(total)}（${pct}%）</p>${acts}</div>
        <p>上传 ${fmtQuota(sub.upload || 0)} · 下载 ${fmtQuota(sub.download || 0)}${expire}</p>
        <span class="bar"><i style="width:${Math.max(2, pct)}%"></i></span>
        <p class="hint">和机场面板同一套账。本机排行只统计采集到的连接，对不齐是正常的。</p>`;
    }
  }
  const boxQ = document.getElementById("quota");
  const alerts = last.alerts || [];
  if (!alerts.length) {
    boxQ.hidden = true;
    boxQ.innerHTML = "";
  } else {
    boxQ.hidden = false;
    boxQ.innerHTML = alerts.map(a => {
      if (a.kind === "leak") {
        if (!s.tun_up) return "";
        const names = (a.names || []).map(n => labelOf(n)).join("、");
        return `<p class="leak-line" data-open-leaks="1"><b>漏网 ${a.count}</b>${names ? " · " + escapeHtml(names) : ""}，点这里看连接</p>`;
      }
      if (a.kind === "new") {
        if (prefs().show_new_banner === false) return "";
        return `<p class="new-line"><b>${escapeHtml(labelOf(a.process))}</b> 开始走网了 <button type="button" data-ack-new="${escapeHtml(a.process)}">知道了</button></p>`;
      }
      if (a.kind === "program") {
        return `<p><b>${escapeHtml(labelOf(a.process))}</b> 今天已用 ${fmtBytes(a.used)}，超过 ${fmtBytes(a.limit)}</p>`;
      }
      return `<p><b>今天合计</b> 已用 ${fmtBytes(a.used)}，超过 ${fmtBytes(a.limit)}</p>`;
    }).join("");
  }
}
function paintSetup() {
  const el = document.getElementById("setup");
  if (!el) return;
  const s = (last && last.status) || {};
  if (filter === "settings" || s.clash_api) {
    el.hidden = true;
    el.innerHTML = "";
    return;
  }
  el.hidden = false;
  el.innerHTML = `<h2>还没接到 Clash</h2>
    <p>排行和分流需要外部控制器。只开系统代理也能看，但要先让客户端开放接口。</p>
    <ol>
      <li>打开 FlClash 或 Clash Verge</li>
      <li>设置里打开外部控制器，地址一般是 <span class="kbd">127.0.0.1:9090</span></li>
      <li>点「测试连接」，或到设置 → 连接核对地址和密钥</li>
    </ol>
    <div class="acts">
      <button type="button" onclick="testClash()">测试连接</button>
      <button type="button" onclick="gotoFilter('settings','connect')">打开连接设置</button>
    </div>
    ${clashNote ? `<p class="hint">${escapeHtml(clashNote)}</p>` : ""}`;
}
function render() {
  const isSet = filter === "settings";
  document.querySelector(".tools").style.display = isSet ? "none" : "flex";
  document.querySelector(".chart-box").style.display = isSet ? "none" : "block";
  document.querySelector(".search").style.display = isSet ? "none" : "block";
  pbox.style.display = (!isSet && filter === "rank") ? "flex" : "none";
  mbox.style.display = (!isSet && filter === "rank") ? "flex" : "none";
  if (last) paintChrome();
  else paintSetup();
  if (isSet) {
    document.getElementById("airport").hidden = true;
    document.getElementById("quota").hidden = true;
    const setup = document.getElementById("setup");
    if (setup) setup.hidden = true;
  }
  const main = document.getElementById("main");
  if (isSet) {
    main.innerHTML = renderSettings();
    return;
  }
  if (!last) return;
  if (filter === "rank") main.innerHTML = renderRank();
  else if (filter === "lanes") main.innerHTML = renderLanes();
  else main.innerHTML = renderConns(filter === "closed" ? (last.closed || []) : (last.flows || []));
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function tick() {
  try {
    const r = await fetch("/api/snapshot");
    last = await r.json();
    if (last.error && last.error !== "warming") throw new Error(last.error);
    if (last.error === "warming") {
      document.getElementById("status").innerHTML = `<span class="chip">正在采集…</span>`;
      return;
    }
    if (filter === "settings") paintChrome();
    else {
      render();
      drawChart();
    }
  } catch (e) {
    document.getElementById("status").textContent = "采集失败 " + e.message;
  }
}
function setFilter(id) {
  gotoFilter(id);
}
document.getElementById("airport").addEventListener("click", async (e) => {
  if (e.target.closest("[data-hide-airport]")) {
    await saveSetting("show_airport", false);
    flashToast("已隐藏。可在设置里重新打开。");
    return;
  }
  if (!e.target.closest("[data-refresh-sub]")) return;
  await fetch("/api/refresh-sub", { method: "POST" });
  setTimeout(tick, 800);
});
document.getElementById("quota").addEventListener("click", async (e) => {
  if (e.target.closest("[data-open-leaks]")) {
    leakOnly = true;
    setFilter("conns");
    return;
  }
  const ack = e.target.closest("[data-ack-new]");
  if (ack) {
    await fetch("/api/ack-new", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ process: ack.dataset.ackNew || "" })
    });
    tick();
  }
});
document.getElementById("show-ignored").onchange = () => render();
document.getElementById("main").addEventListener("click", (e) => {
  const ign = e.target.closest("[data-ignore]");
  if (ign) {
    e.stopPropagation();
    savePref(ign.dataset.ignore, { ignored: ign.dataset.on === "1" });
    return;
  }
  const pane = e.target.closest("[data-pane]");
  if (pane) {
    setPane = pane.dataset.pane;
    history.replaceState(null, "", "#settings/" + setPane);
    render();
    return;
  }
  const pin = e.target.closest("[data-pin]");
  if (pin) {
    e.stopPropagation();
    savePref(pin.dataset.pin, { pinned: pin.dataset.on === "1" });
    return;
  }
  const btn = e.target.closest("[data-close]");
  if (btn) {
    const ids = (btn.dataset.close || "").split(",").filter(Boolean);
    fetch("/api/close", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids })
    }).then(() => tick());
    return;
  }
  if (filter !== "lanes" && filter !== "rank") return;
  const tr = e.target.closest("tr.foldable");
  if (!tr) return;
  const key = tr.dataset.key;
  if (!key) return;
  if (opened.has(key)) opened.delete(key); else opened.add(key);
  render();
});
(function bindChart() {
  const canvas = document.getElementById("chart");
  canvas.addEventListener("mousemove", (e) => {
    const hist = (last && last.history) || [];
    if (hist.length < 2) return;
    const rect = canvas.getBoundingClientRect();
    const t = (e.clientX - rect.left) / Math.max(rect.width, 1);
    hoverIdx = Math.round(Math.max(0, Math.min(1, t)) * (hist.length - 1));
    drawChart();
  });
  canvas.addEventListener("mouseleave", () => { hoverIdx = -1; drawChart(); });
  window.addEventListener("resize", () => drawChart());
})();
document.getElementById("btn-update").onclick = doUpdate;
window.addEventListener("hashchange", () => { applyHash(); gotoFilter(filter, setPane); });
window.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") {
    if (e.key === "Escape") { e.target.blur(); document.getElementById("q").value = ""; render(); }
    return;
  }
  if (e.key === "/" ) { e.preventDefault(); document.getElementById("q").focus(); return; }
  const map = { "1": "rank", "2": "lanes", "3": "conns", "4": "closed", "5": "settings" };
  if (map[e.key]) gotoFilter(map[e.key]);
});
(async function boot() {
  applyHash();
  try {
    settingsCache = await (await fetch("/api/settings")).json();
    if (!location.hash && settingsCache.last_filter && FILTERS.some(f => f[0] === settingsCache.last_filter)) {
      filter = settingsCache.last_filter;
    }
    if (settingsCache.last_period && PERIODS.some(p => p[0] === settingsCache.last_period)) {
      period = settingsCache.last_period;
    }
  } catch {}
  [...box.children].forEach(x => x.classList.toggle("on", x.textContent === (FILTERS.find(f => f[0] === filter) || [])[1]));
  [...pbox.children].forEach(x => x.classList.toggle("on", x.textContent === (PERIODS.find(p => p[0] === period) || [])[1]));
  const bv = document.getElementById("brand-ver");
  if (bv && settingsCache && settingsCache.version) bv.textContent = "v" + settingsCache.version;
  peekUpdate();
  tick();
  setInterval(tick, 2000);
})();
</script>
</body>
